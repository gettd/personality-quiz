<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nine Personality Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="quiz-container">
      <div class="intro-container">

        <div class="intro-page active" id="intro0">
          <div class="intro-content"></div>
          <button class="image-btn btn-actions">
              <img src="assets/nextBtn.png" alt="Next" id="next0">
          </button>
        </div>

        <div class="intro-page" id="intro1">
          <div class="intro-content"></div>
          <button class="image-btn btn-actions">
              <img src="assets/nextBtn.png" alt="Next" id="next1">
          </button>
        </div>

        <div class="intro-page" id="intro2">
          <div class="intro-content"></div>
          <button class="image-btn btn-actions">
            <img src="assets/nextBtn.png" alt="Next" id="next2">
          </button>
        </div>

        <div class="intro-page" id="intro3">
          <div class="intro-content intro-input">
            <input type="text" id="playerName" placeholder="ชื่อ-นามสกุล"/>
            <input type="text" id="playerAcademicYear" placeholder="ชั้น"/>
            <input type="text" id="playerId" placeholder="เลขที่"/>
          </div>
          <button class="image-btn btn-actions" onclick="startQuiz()">
            <img src="assets/startBtn.png" alt="Start Quiz">
          </button>
        </div>

      </div>
      
      <div class="section-container">
        <div id="section-1" class="section-page">
          <div class="intro-content"></div>
          <button class="image-btn btn-actions" onclick="continueFromSection()">
                <img src="assets/nextBtn.png" alt="Next">
          </button>
        </div>

        <div id="section-2" class="section-page">
          <div class="intro-content"></div>
          <button class="image-btn btn-actions" onclick="continueFromSection()">
                <img src="assets/nextBtn.png" alt="Next">
          </button>
        </div>

        <div id="section-3" class="section-page">
          <div class="intro-content"></div>
          <button class="image-btn btn-actions" onclick="continueFromSection()">
                <img src="assets/nextBtn.png" alt="Next">
          </button>
        </div>
      </div>

      <div id="question-box" class="hidden">
        <h1 id="question-title"></h1>
        <div id="question-elements">
          <div class="image-container">
              <img id="question-image" src="" alt="Situation Image" style="width: 100%; max-width: 600px;">
              
              <p id="question-body"></p>
          </div>
          
          <div id="answers"></div>
        </div>
      </div>

      <div id="result-box" class="hidden">
        <div id="result-elements">
          <div>
            <p id="result"></p>
          </div>
          <div>
              <h3>การกระจายคะแนน</h3>
              <canvas id="resultChart"></canvas>
          </div>
          
        </div>

        <button class="image-btn btn-actions" onclick="restartQuiz()">
                <img src="assets/restartBtn.png" alt="Next">
        </button>

      </div>
    </div>
    <audio id="bg-music" loop>
      <source src="assets/first glance.mp3" type="audio/mpeg">
    </audio>
  </div>
  

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <script src="script.js"></script>
</body>
</html>
